name: Build

on:
  push:
    branches:
      - master
      - refactor-2
  pull_request:
    branches:
      - master
      - refactor-2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # Use system Gradle to regenerate wrapper with correct version (e.g., Gradle 9)
    - name: Create gradle wrapper
      run: gradle wrapper --gradle-version 9.0.0 --distribution-type all

    - name: Grant execute permission for Gradle wrapper
      run: chmod +x ./gradlew

    - name: Run tests with coverage
      run: ./gradlew test jacocoTestReport

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/reports/tests

    - name: Upload code coverage report
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: build/reports/jacoco/test/html

    - name: Generate docs
      run: ./gradlew groovydoc

    - name: Upload GroovyDoc
      uses: actions/upload-artifact@v4
      with:
        name: groovydoc
        path: build/docs/groovydoc